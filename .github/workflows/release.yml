name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../secforge-${{ matrix.target }}.tar.gz secforge
          cd -
          shasum -a 256 secforge-${{ matrix.target }}.tar.gz > secforge-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/secforge.exe -DestinationPath secforge-${{ matrix.target }}.zip
          (Get-FileHash secforge-${{ matrix.target }}.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii secforge-${{ matrix.target }}.zip.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            secforge-*.tar.gz
            secforge-*.tar.gz.sha256
            secforge-*.zip
            secforge-*.zip.sha256
